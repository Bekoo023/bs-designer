name: Website checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Syntax and static build
        run: |
          npm run check
          npm run build
          npm test
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: npm run test:browser
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: website-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save built website
        uses: actions/upload-artifact@v5
        with:
          name: bs-designer-website
          path: dist/
          retention-days: 7
